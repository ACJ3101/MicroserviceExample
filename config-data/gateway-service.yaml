spring:
  application:
    name: gateway-service

server:
  port: 8085

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: usuario-service
          uri: lb://usuario-service
          predicates:
            - Path=/usuarios/**
        - id: car-service
          uri: lb://car-service
          predicates:
            - Path=/cars/**
        - id: motorbike-service
          uri: lb://motorbike-service
          predicates:
            - Path=/motorbikes/**